<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jėga</title>
<meta name="description" content="Your own workout routine planner.">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jėga">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column; sticky top bar; content scrolls; one accent (ember). */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#f6f5f2; --ink:#1c1916; --muted:#78716a;
  --line:#e6e2db; --line-strong:#d8d3ca; --accent:#e8562a; --accent-ink:#ffffff;
  --accent-weak:#fbe7de; --good:#2f9e63; --mapbase:#ded9d0; --shadow:0 1px 2px rgba(28,25,22,.06),0 8px 24px rgba(28,25,22,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141311; --surface:#1e1c19; --surface-2:#24211d; --ink:#f3efe8; --muted:#9c948a;
  --line:#2d2a25; --line-strong:#3a362f; --accent:#ff6a3d; --accent-ink:#1a0f09;
  --accent-weak:#3a241a; --good:#45b97c; --mapbase:#332f2a; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1e1c19; --surface-2:#24211d; --ink:#f3efe8; --muted:#9c948a;
  --line:#2d2a25; --line-strong:#3a362f; --accent:#ff6a3d; --accent-ink:#1a0f09;
  --accent-weak:#3a241a; --good:#45b97c; --mapbase:#332f2a; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",sans-serif; margin:0; line-height:1.05; text-wrap:balance; letter-spacing:.2px}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:16px}
img{max-width:100%; display:block}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{max-width:560px; margin:0 auto; min-height:100%; position:relative}

/* ---- Top bar ---- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0); z-index:20;
  display:flex; align-items:center; gap:8px; min-height:56px;
  padding-left:max(14px,env(safe-area-inset-left,0)); padding-right:max(14px,env(safe-area-inset-right,0));
  background:color-mix(in srgb,var(--bg) 86%,transparent); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);z-index:30;background:var(--bg)}
.topbar h1{font-size:26px; font-weight:700; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .sub{font-size:22px}
.iconbtn{
  display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
  border:none; background:transparent; color:var(--ink); border-radius:12px; flex:none;
}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tb-action{
  border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px;
  padding:9px 16px; border-radius:11px; flex:none;
}
.tb-link{border:none;background:transparent;color:var(--accent);font-weight:700;font-size:15px;padding:9px 6px;flex:none}

/* ---- Screen ---- */
.screen{
  padding-left:max(16px,env(safe-area-inset-left,0)); padding-right:max(16px,env(safe-area-inset-right,0));
  padding-block:14px 120px;
}
.screen.flush{padding-bottom:32px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 2px 10px}
.eyebrow:first-child{margin-top:6px}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;font-weight:700;font-size:16px;padding:14px 18px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%}
.btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:#d64527;border-color:transparent;background:transparent}
.btn-row{display:flex;gap:10px}
.btn-row .btn{width:auto;flex:1}

/* ---- Cards / lists ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.folder{display:flex;align-items:center;gap:8px;margin:20px 2px 10px}
.folder:first-child{margin-top:4px}
.folder .chev{width:18px;height:18px;transition:transform .18s;color:var(--muted)}
.folder.collapsed .chev{transform:rotate(-90deg)}
.folder .ftitle{font-family:"Barlow",sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.folder .count{color:var(--muted);font-size:13px;font-weight:600}

.rcard{display:flex;align-items:center;gap:12px;padding:15px 14px;margin-bottom:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);color:inherit}
.rcard:active{transform:scale(.993)}
.rcard .rc-body{flex:1;min-width:0}
.rcard .rc-title{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rc-sub{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.rcard .rc-more{flex:none;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:38px 18px}
.empty svg{width:40px;height:40px;stroke:currentColor;stroke-width:1.6;fill:none;opacity:.6;margin-bottom:10px}

/* ---- Exercise row ---- */
.thumb{width:52px;height:52px;border-radius:12px;background:var(--surface-2);flex:none;object-fit:cover;border:1px solid var(--line)}
.thumb.sm{width:44px;height:44px;border-radius:10px}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-family:"Barlow Condensed";font-size:18px}

.exrow{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exrow .ex-body{flex:1;min-width:0}
.exrow .ex-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exrow .ex-sub{color:var(--muted);font-size:13px;margin-top:1px}
.exrow .ex-scheme{color:var(--accent);font-weight:700;font-size:13.5px;margin-top:2px}

/* ---- Summary ---- */
.sumwrap{padding:16px;margin-top:6px}
.stats{display:flex;gap:10px;margin-bottom:6px}
.stat{flex:1;background:var(--surface-2);border-radius:12px;padding:11px 8px;text-align:center}
.stat .n{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1}
.stat .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.bodymap{display:flex;justify-content:center;gap:4px;margin:14px 0 6px}
.bodymap svg{height:188px;width:auto}
.mbars{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.mbar{display:grid;grid-template-columns:92px 1fr 30px;align-items:center;gap:10px}
.mbar .ml{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mt{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.mbar .mt span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.mbar .mv{font-size:13px;color:var(--muted);text-align:right;font-weight:600}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 4px}
.tab{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:11px 10px;position:relative}
.tab.active{color:var(--ink)}
.tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;border-radius:2px;background:var(--accent)}

/* ---- Exercise detail ---- */
.hero{aspect-ratio:16/10;background-color:var(--surface-2);background-size:contain;background-position:center;background-repeat:no-repeat;border-radius:16px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.hero img,.hero video{width:100%;height:100%;object-fit:contain}
.hero.hasvid video{opacity:0;transition:opacity .18s ease}
.hero.hasvid video.ready{opacity:1}
.meta{display:flex;flex-direction:column;gap:7px;margin:16px 2px}
.meta .row{display:flex;gap:8px;font-size:15px}
.meta .k{color:var(--muted);min-width:132px}
.meta .v{font-weight:600}
.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.chip2{background:var(--accent-weak);color:var(--accent);font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;margin-top:4px}
.step{display:flex;gap:13px}
.step .num{counter-increment:s;flex:none;width:27px;height:27px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.step .num::before{content:counter(s)}
.step p{margin:2px 0;font-size:15.5px}

/* ---- Editor ---- */
.field{margin:14px 0}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:13px 14px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{resize:vertical;min-height:44px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.excard{padding:13px;margin-bottom:12px}
.excard .eh{display:flex;align-items:center;gap:11px}
.excard .eh .ex-name{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord{display:flex;flex-direction:column;gap:2px;flex:none}
.ord button{width:28px;height:22px;border:none;background:var(--surface-2);color:var(--muted);border-radius:7px;display:flex;align-items:center;justify-content:center}
.ord button:disabled{opacity:.35}
.ord svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sets{margin-top:12px}
.sets .sh,.sets .sr{display:grid;grid-template-columns:40px 1fr 1fr 36px;gap:8px;align-items:center}
.sets .sh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 2px 6px}
.sets .sr{margin-bottom:7px}
.sets .sr .sn{font-weight:700;color:var(--muted);text-align:center;background:var(--surface-2);border-radius:9px;padding:9px 0}
.sets .sr input{width:100%;text-align:center;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 6px;color:var(--ink)}
.sets .sr input:focus{outline:none;border-color:var(--accent)}
.sets .sr .del{border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sets .sr .del svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none}
.addset{width:100%;border:1px dashed var(--line-strong);background:transparent;color:var(--muted);font-weight:700;border-radius:11px;padding:11px;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:7px}
.addset svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* ---- Library ---- */
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px 13px 42px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--muted);stroke-width:2;fill:none}
.filters{display:flex;gap:9px;margin-bottom:6px}
.filters select{flex:1;min-width:0}
.libr{display:flex;align-items:center;gap:13px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:none;border-right:none;border-top:none;color:inherit}
.libr .lb{flex:1;min-width:0}
.libr .ln{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libr .ls{color:var(--muted);font-size:13px;margin-top:1px}
.addbtn{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.addbtn svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.addbtn.added{background:var(--good)}

/* ---- Bottom sheet ---- */
.sheet-back{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:50;opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
.sheet-back.show{opacity:1}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 0 max(14px,env(safe-area-inset-bottom,0));transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-back.show .sheet{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:6px auto 10px}
.sheet .sitem{display:flex;align-items:center;gap:14px;width:100%;border:none;background:transparent;color:var(--ink);font-size:16.5px;font-weight:600;padding:15px 22px;text-align:left}
.sheet .sitem svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.sheet .sitem.danger{color:#d64527}.sheet .sitem.danger svg{color:#d64527}
.sheet .stitle{font-family:"Barlow Condensed";font-weight:700;font-size:19px;padding:4px 22px 8px}

/* ---- Prompt dialog ---- */
.dlg-back{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.dlg-back.show{opacity:1}
.dlg{width:100%;max-width:360px;background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.dlg h3{font-size:21px;margin-bottom:4px}
.dlg p{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.dlg .input{margin-bottom:16px}
.dlg .btn-row .btn{padding:12px}

/* ---- Toast + fab ---- */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:70;opacity:0;transition:all .22s;pointer-events:none;box-shadow:var(--shadow);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;pointer-events:none;padding:0 0 env(safe-area-inset-bottom,0)}
.sticky-foot .inner{width:100%;max-width:560px;padding:12px max(16px,env(safe-area-inset-left,0)) 14px;background:linear-gradient(to top,var(--bg) 62%,transparent);pointer-events:auto}
.foot2{display:flex;gap:10px}
.foot2 .btn.primary{flex:1}
.foot2 .btn.sq{flex:0 0 auto;width:auto;padding-left:16px;padding-right:16px}

/* ---- Session (Start Workout) ---- */
.resume-banner{display:flex;align-items:center;gap:12px;background:var(--accent-weak);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin:4px 0 14px;width:100%;text-align:left;color:var(--ink)}
.resume-banner .rb-ic{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.resume-banner .rb-ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.resume-banner .rb-b{flex:1;min-width:0}
.resume-banner .rb-t{font-weight:700;font-size:15px}
.resume-banner .rb-s{color:var(--muted);font-size:12.5px}
.resume-banner .rb-go{background:var(--accent);color:var(--accent-ink);border:none;font-weight:700;border-radius:10px;padding:8px 14px;flex:none}

.progwrap{display:flex;align-items:center;gap:12px;margin:8px 2px 16px}
.progbar{flex:1;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.progbar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.progmeta{font-family:"Barlow Condensed";font-weight:700;font-size:19px;white-space:nowrap}
.elapsed{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;margin:-6px 2px 14px}
.elapsed svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}

.scard{margin-bottom:11px;overflow:hidden}
.scard .sc-head{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;background:transparent;border:none;color:inherit}
.scard .sc-body{flex:1;min-width:0}
.scard .sc-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sc-sub{color:var(--muted);font-size:13px;margin-top:1px}
.scard .sc-last{color:var(--accent);font-size:12.5px;font-weight:700;margin-top:2px}
.scard.done .sc-name{color:var(--muted)}
.donebtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.donebtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.donebtn.on{background:var(--good);border-color:var(--good);color:#fff}
.sc-detail{padding:2px 14px 14px;border-top:1px solid var(--line)}
.sc-detail .dlabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 8px}
.pips{display:flex;gap:8px;flex-wrap:wrap}
.pip{min-width:40px;height:40px;padding:0 6px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface-2);font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kgrow{display:flex;align-items:center;gap:10px;margin-top:4px}
.kgrow input{flex:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:11px 13px;color:var(--ink)}
.kgrow input:focus{outline:none;border-color:var(--accent)}
.kgrow .unit{color:var(--muted);font-weight:700}

.restchip{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(92px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 14px 11px 18px;display:flex;align-items:center;gap:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:all .2s;pointer-events:none}
.restchip.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.restchip .rt{font-family:"Barlow Condensed";font-weight:700;font-size:23px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.restchip .rl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;font-weight:700}
